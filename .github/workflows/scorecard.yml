name: OpenSSF Scorecard

# Evalúa prácticas de seguridad del repo (branch protection, reviews,
# CI, pinning, política de seguridad…). Solo tiene sentido con el repo
# público en GitHub; antes de eso el job queda inactivo.
on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
