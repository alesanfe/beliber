name: CI - Seguridad (secretos + dependencias)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '37 4 * * 1'

jobs:
  secrets:
    name: 'Escaneo de secretos (gitleaks)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action@v2 exige licencia; el binario OSS es libre —
      # se instala fijado (mismo enfoque que en NT4H2).
      - name: Instalar gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
      - run: gitleaks git --verbose --redact .

  pip-audit:
    name: 'Auditoría dependencias Python (relay)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit -r server/requirements.txt

  # Solo en PR: bloquea diffs de dependencias que introducen CVEs.
  dependency-review:
    name: 'Revisión de dependencias (PR)'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
