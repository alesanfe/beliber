name: CI - Seguridad (secretos + dependencias)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '37 4 * * 1'

jobs:
  secrets:
    name: 'Escaneo de secretos (gitleaks)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  pip-audit:
    name: 'Auditoría dependencias Python (relay)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit -r server/requirements.txt
